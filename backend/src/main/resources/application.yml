server:
  port: 8080

spring:
  application:
    name: metromind
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/metromind}
    username: ${DB_USER:metromind}
    password: ${DB_PASSWORD:metromind}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

metromind:
  sim:
    speed: 10            # simulated seconds per real second
    tick-millis: 500
    start-clock: "07:30"
    strategy: NO_CONTROL
    run-time-variability: 0  # spread of run times around nominal, e.g. 0.05 for ~5 %; 0 = to the timetable
    run-time-seed: 0       # also seeds dwell draws, from a separate stream
    dwell-variability: 0   # spread of dwells around the passenger-driven one, e.g. 0.1; 0 = passengers alone
    relief-overrun-share: 0    # share of crew changes whose relief driver is late, e.g. 0.1; 0 = always on time
    relief-overrun-seconds: 60 # mean overrun of a late relief, seconds
  replay:
    retention-minutes: 30  # simulated minutes of snapshots kept for time travel
    interval-seconds: 10   # simulated seconds between kept snapshots
  kafka:
    enabled: true
  redis:
    enabled: true
  persistence:
    enabled: true
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

---
# Run without any infrastructure: mvn spring-boot:run -Dspring-boot.run.profiles=standalone
spring:
  config:
    activate:
      on-profile: standalone
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
metromind:
  kafka:
    enabled: false
  redis:
    enabled: false
  persistence:
    enabled: false
management:
  health:
    redis:
      enabled: false
